    <rect id="bar-2" x="122.5" y="110" width="10" height="28" rx="5" fill="#5BB7FF"/>
    <rect id="bar-3" x="142" y="103" width="10" height="42" rx="5" fill="#7B9AFF"/>
    <rect id="bar-4" x="161.5" y="111" width="10" height="26" rx="5" fill="#9A84FF"/>
