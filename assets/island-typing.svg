<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="typing-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop stop-color="#202B48"/>
      <stop offset="1" stop-color="#090D18"/>
    </linearGradient>
    <linearGradient id="typing-aurora" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop stop-color="#54F5F2"/>
      <stop offset=".52" stop-color="#568BFF"/>
      <stop offset="1" stop-color="#B16BFF"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="56"
        fill="url(#typing-base)"/>
  <rect x="11" y="11" width="234" height="234" rx="53"
        fill="none" stroke="#FFFFFF" stroke-opacity=".09" stroke-width="2"/>
  <rect x="32" y="94" width="192" height="74" rx="37"
        fill="url(#typing-aurora)" opacity=".15"/>
  <rect x="32" y="88" width="192" height="72" rx="36"
        fill="url(#typing-aurora)"/>
  <rect x="38" y="94" width="180" height="60" rx="30" fill="#080C17"/>

  <circle id="typing-indicator" cx="75" cy="124" r="8" fill="#65FAEF"/>
  <g id="typing-keys">
    <rect id="key-left" x="103" y="106" width="24" height="21" rx="5" fill="#568BFF"/>
    <rect id="key-center" x="135" y="106" width="24" height="21" rx="5" fill="#A2CBFF"/>
    <rect id="key-right" x="167" y="106" width="24" height="21" rx="5" fill="#AD7BFF"/>
    <rect id="key-space" x="103" y="134" width="88" height="9" rx="4.5"
          fill="url(#typing-aurora)"/>
  </g>
</svg>
